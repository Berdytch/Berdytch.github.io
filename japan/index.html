<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japan · January 2027 · 3D Trip Map</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6efe2;--ink:#1d2540;--muted:#6b6f85;--red:#c8102e;--card:rgba(246,239,226,.94);--line:rgba(29,37,64,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1a1f33;--ink:#f3ead8;--muted:#a3a8c0;--card:rgba(26,31,51,.93);--line:rgba(243,234,216,.16)}}
:root[data-theme="dark"]{--paper:#1a1f33;--ink:#f3ead8;--muted:#a3a8c0;--card:rgba(26,31,51,.93);--line:rgba(243,234,216,.16)}
html,body{height:100%;margin:0;background:#0f1a3a;color:var(--ink);font-family:"Shippori Mincho",Georgia,"Times New Roman",serif;overflow:hidden}
#sun{position:fixed;right:12%;top:8%;width:min(24vw,200px);aspect-ratio:1;border-radius:50%;background:#c8102e;opacity:.85;box-shadow:0 0 90px #c8102e88}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 70% 0%,#2b3a78 0,#16224d 45%,#0b1230 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.lbl{position:fixed;left:0;top:0;pointer-events:none;transform:translate(-50%,-130%);text-align:center;color:#fff;text-shadow:0 1px 6px #000c;white-space:nowrap;will-change:transform}
.lbl b{display:block;font-size:15px;letter-spacing:.04em}.lbl i{font-style:normal;font-size:11px;opacity:.85}
.lbl span{display:inline-block;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;margin-bottom:2px;text-shadow:none}
header{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));color:#fff;text-shadow:0 2px 10px #000a;pointer-events:none}
header h1{margin:0;font-size:clamp(20px,3.4vw,32px);letter-spacing:.06em}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
aside{position:fixed;right:14px;top:50%;transform:translateY(-50%);width:300px;max-height:78vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;backdrop-filter:blur(8px)}
.st{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--ink);font:inherit}
.st:hover,.st.on{background:rgba(200,16,46,.12)}
.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px}
.st h3{margin:0;font-size:15px}.st small{color:var(--muted);display:block;font-size:12px;line-height:1.35;margin-top:2px}
.hint{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));color:#fff;font-size:12px;opacity:.75;text-shadow:0 1px 4px #000}
@media (max-width:700px){aside{top:auto;bottom:0;right:0;left:0;width:auto;transform:none;max-height:34vh;border-radius:14px 14px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}.hint{display:none}.lbl b{font-size:12px}}
</style>
</head>
<body>
<div id="bg"></div><div id="sun"></div>
<header><h1>日本 · Japan 2027</h1><p>18 Jan – early Feb · Osaka → Hiroshima → Kyoto → Tokyo</p></header>
<aside id="list"></aside>
<div class="hint">Drag to rotate · scroll/pinch to zoom · tap a stop to fly there</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,K=2,LX=137,LZ=37;
const P=(lon,lat,y=0)=>new T.Vector3((lon-LX)*K,y,-(lat-LZ)*K*1.22);
const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new T.Scene();
const cam=new T.PerspectiveCamera(45,1,.1,300);
scene.add(new T.HemisphereLight(0xfff3e0,0x1b2a5c,.9));
const sunL=new T.DirectionalLight(0xffe2c0,.9);sunL.position.set(-10,20,10);scene.add(sunL);

// sea
const sea=new T.Mesh(new T.CircleGeometry(80,64).rotateX(-Math.PI/2),new T.MeshLambertMaterial({color:0x1d3b7a,transparent:true,opacity:.85}));
sea.position.y=-.45;scene.add(sea);
const grid=new T.GridHelper(120,60,0x4b66b0,0x2c448a);grid.position.y=-.44;grid.material.transparent=true;grid.material.opacity=.25;scene.add(grid);

// islands
const isl={
honshu:[[130.9,34],[131.8,34.4],[132.5,35.4],[133.2,35.5],[134.3,35.6],[135.3,35.6],[135.9,35.5],[136,36],[136.7,37.3],[137.3,37.5],[137,36.8],[138.3,37],[139,37.9],[139.9,39.5],[140,40.5],[140,41.2],[140.9,41.4],[141.4,41.4],[141.5,40.3],[142,39.5],[141.5,38.3],[141,37],[140.8,36],[140.8,35.7],[140.3,35.2],[139.8,35],[139.8,35.3],[139.6,35.3],[139.2,34.9],[138.8,34.6],[138.2,34.6],[137.2,34.6],[136.9,34.7],[136.9,34.3],[136.3,34.2],[135.8,33.5],[135.1,33.8],[135.1,34.4],[134.7,34.7],[133.5,34.4],[132.4,34.2],[131.5,33.9]],
kyushu:[[130.9,33.9],[131.7,33.6],[131.9,32.8],[131.5,31.4],[130.7,31],[130.2,31.3],[130.2,32.6],[130,33.2],[129.8,33.5],[130.4,33.7]],
shikoku:[[132.4,33.9],[133.7,34.3],[134.6,34.2],[134.2,33.5],[133.5,33.4],[132.7,32.9]],
hokkaido:[[140,41.5],[140.4,42.6],[140.4,43.3],[141.4,43.2],[141.8,44.5],[142,45.4],[142.9,44.3],[143.9,44.2],[145.3,43.4],[144.3,43],[143.3,42],[142,42.5],[141,42.6]]};
const landMat=new T.MeshLambertMaterial({color:0xefe4cc}),edgeMat=new T.LineBasicMaterial({color:0xc8102e});
for(const k in isl){
  const s=new T.Shape(isl[k].map(([lo,la])=>new T.Vector2((lo-LX)*K,(la-LZ)*K*1.22)));
  const g=new T.ExtrudeGeometry(s,{depth:.5,bevelEnabled:true,bevelSize:.08,bevelThickness:.06,bevelSegments:2}).rotateX(-Math.PI/2);
  g.translate(0,-.45,0);
  const m=new T.Mesh(g,landMat);scene.add(m);
  const e=new T.LineSegments(new T.EdgesGeometry(g,60),edgeMat);scene.add(e);
}
// greenish highland patch (Japanese Alps feel)
for(const [lo,la,s] of [[137.6,36.2,1],[138.4,36.6,.8],[139.3,37.4,.7],[140.7,39.3,.9],[141.2,42.9,.8],[136.4,35.1,.5]]){
  const c=new T.Mesh(new T.ConeGeometry(.9*s,.9*s,6),new T.MeshLambertMaterial({color:0x7da07a,flatShading:true}));
  const p=P(lo,la,.3+.45*s);c.position.copy(p);scene.add(c);
}

// Fuji
const fuji=P(138.73,35.36);
const fc=new T.Mesh(new T.ConeGeometry(1,2.2,32),new T.MeshLambertMaterial({color:0x3f5f9a}));fc.position.set(fuji.x,.85,fuji.z);scene.add(fc);
const cap=new T.Mesh(new T.ConeGeometry(.5,.9,32),new T.MeshLambertMaterial({color:0xffffff}));cap.position.set(fuji.x,1.4,fuji.z);scene.add(cap);

// cities
const C={
osaka:{n:'Osaka',jp:'大阪',d:'18–20 Jan',ll:[135.5,34.69]},
hiro:{n:'Hiroshima',jp:'広島',d:'21 Jan',ll:[132.46,34.39]},
kyoto:{n:'Kyoto',jp:'京都',d:'21–24 Jan',ll:[135.77,35.01]},
tokyo:{n:'Tokyo',jp:'東京',d:'24 Jan →',ll:[139.69,35.69]},
fuji:{n:'Mt Fuji',jp:'富士山',d:'25 Jan',ll:[138.73,35.36]}};
const mk=[],rings=[];
for(const k in C){
  const c=C[k];c.p=P(...c.ll,.1);
  const pole=new T.Mesh(new T.CylinderGeometry(.03,.03,1.4),new T.MeshBasicMaterial({color:0xc8102e}));
  pole.position.set(c.p.x,.7,c.p.z);scene.add(pole);
  const b=new T.Mesh(new T.SphereGeometry(.2,20,20),new T.MeshLambertMaterial({color:0xc8102e,emissive:0x800010}));
  b.position.set(c.p.x,1.45,c.p.z);scene.add(b);
  const r=new T.Mesh(new T.RingGeometry(.25,.32,32).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:0xff4d63,transparent:true,side:2}));
  r.position.set(c.p.x,.07,c.p.z);scene.add(r);rings.push(r);
  const el=document.createElement('div');el.className='lbl';
  el.innerHTML=`<span>${c.d}</span><b>${c.n} ${c.jp}</b>`;document.body.appendChild(el);c.el=el;c.top=new T.Vector3(c.p.x,1.9,c.p.z);
}

// route
const legs=[['osaka','hiro',2.2],['hiro','kyoto',2.4],['kyoto','tokyo',3],['tokyo','fuji',1.4],['fuji','tokyo',-1.2]];
const col=[0xffd24a,0xffd24a,0xff7a8a,0xffffff,0xffffff];
const curves=[];
legs.forEach(([a,b,h],i)=>{
  const A=C[a].p.clone().setY(1.45),B=C[b].p.clone().setY(1.45);
  const M=A.clone().add(B).multiplyScalar(.5);M.y+=Math.abs(h)*1.3;
  const side=new T.Vector3().subVectors(B,A).cross(new T.Vector3(0,1,0)).normalize().multiplyScalar(h<0?-1.1:0);M.add(side);
  const cv=new T.QuadraticBezierCurve3(A,M,B);curves.push(cv);
  scene.add(new T.Mesh(new T.TubeGeometry(cv,48,.06,8),new T.MeshBasicMaterial({color:col[i]})));
});
const orb=new T.Mesh(new T.SphereGeometry(.17,16,16),new T.MeshBasicMaterial({color:0xffffff}));scene.add(orb);
const glow=new T.PointLight(0xffd24a,1.5,6);orb.add(glow);

// sakura
const N=220,pp=new Float32Array(N*3),pv=[];
for(let i=0;i<N;i++){pp.set([(Math.random()-.5)*50,Math.random()*18,(Math.random()-.5)*40],i*3);pv.push(Math.random()*.6+.3)}
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pp,3));
const pts=new T.Points(pg,new T.PointsMaterial({color:0xffb7c5,size:.16,transparent:true,opacity:.9}));scene.add(pts);

// orbit camera
let th=.15,ph=.85,dist=38,tgt=new T.Vector3(1,0,-3),gT=tgt.clone(),gD=dist;
function placeCam(){cam.position.set(tgt.x+dist*Math.sin(ph)*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt)}
const cv=renderer.domElement;let drag=null,pinch=0;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;th-=(e.clientX-drag[0])*.007;ph=Math.min(1.45,Math.max(.2,ph-(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();gD=Math.min(60,Math.max(7,gD*(1+e.deltaY*.001)))},{passive:false});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)gD=Math.min(60,Math.max(7,gD*pinch/d));pinch=d}},{passive:true});
cv.addEventListener('touchend',()=>pinch=0);

// itinerary panel
const stops=[
['osaka','Osaka','18–20 Jan','Arrive 2:00 PM on the 18th. Three days of food, castle and neon.',12],
['hiro','Hiroshima','21 Jan','Day trip on the Sanyo Shinkansen, then on to Kyoto.',12],
['kyoto','Kyoto','21–24 Jan','Overnight on the 21st, then three days of temples and gardens.',10],
['tokyo','Tokyo','24 Jan','Shinkansen from Kyoto to Tokyo.',12],
['fuji','Mt Fuji','25 Jan','Day trip to the iconic volcano.',9],
['tokyo','Tokyo','25 Jan onwards','The remaining 9 days exploring Tokyo!',10]];
const list=document.getElementById('list');
stops.forEach((s,i)=>{
  const b=document.createElement('button');b.className='st';
  b.innerHTML=`<div class="n">${i+1}</div><div><h3>${s[1]} · ${s[2]}</h3><small>${s[3]}</small></div>`;
  b.onclick=()=>{document.querySelectorAll('.st').forEach(x=>x.classList.remove('on'));b.classList.add('on');gT=C[s[0]].p.clone().setY(0);gD=s[4]};
  list.appendChild(b);
});

function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new T.Clock();let u=0;
function loop(){
  const dt=clock.getDelta(),t=clock.elapsedTime;
  tgt.lerp(gT,.06);dist+=(gD-dist)*.06;
  if(!drag)th+=dt*.02;
  placeCam();
  // orb travels along whole route
  u=(u+dt*.12)%legs.length;const i=Math.floor(u);orb.position.copy(curves[i].getPoint(u-i));
  rings.forEach((r,k)=>{const s=1+((t*.8+k*.3)%1)*1.6;r.scale.set(s,1,s);r.material.opacity=1-((t*.8+k*.3)%1)});
  const a=pg.attributes.position;
  for(let j=0;j<N;j++){let y=a.getY(j)-pv[j]*dt;if(y<0)y=18;a.setY(j,y);a.setX(j,a.getX(j)+Math.sin(t+j)*.004)}
  a.needsUpdate=true;
  for(const k in C){const c=C[k],v=c.top.clone().project(cam);
    c.el.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-130%)`;
    c.el.style.display=v.z<1?'block':'none'}
  renderer.render(scene,cam);requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
